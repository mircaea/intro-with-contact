# Cloud Build configuration for deploying to Cloud Run
# Trigger this by connecting your GitHub repo in Cloud Build or manually

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/psychotherapy-site:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/psychotherapy-site:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/psychotherapy-site:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/psychotherapy-site:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'psychotherapy-site'
      - '--image'
      - 'gcr.io/$PROJECT_ID/psychotherapy-site:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'

# Substitution variables (set defaults here, override in trigger)
substitutions:
  _REGION: 'europe-west1'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Images to be pushed
images:
  - 'gcr.io/$PROJECT_ID/psychotherapy-site:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/psychotherapy-site:latest'

# Build timeout (10 minutes)
timeout: '600s'
